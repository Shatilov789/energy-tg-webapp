name: CI

# Pushes to main and test run this through deploy.yml, ahead of the deployment.
on:
  pull_request:
    branches: [main, test]
  workflow_call:

# The workflow token only needs to read the code.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruff==0.8.6 black==24.10.0

      - name: Ruff check
        run: ruff check .

      - name: Black format check
        run: black --check .

  test:
    name: Tests & Migrations
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: energy_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/energy_crm_test
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest backend/tests --cov=backend/app --cov-report=term-missing

      - name: Migrations apply and match the models
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini check

  frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build

  stack:
    name: Deployment Stack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack the way the server does
        run: |
          cp .env.deploy.example .env.deploy
          docker compose -p energy-ci --env-file .env.deploy -f docker-compose.deploy.yml up -d --build --wait

      - name: Check the web app and the API through nginx
        run: |
          curl -fsS http://127.0.0.1:8081/health
          curl -fsS http://127.0.0.1:8081/deals/new | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/auth/me)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Dev-Telegram-Id: 1' http://127.0.0.1:8081/api/auth/me)" = "401"

      - name: Show logs on failure
        if: failure()
        run: docker compose -p energy-ci --env-file .env.deploy -f docker-compose.deploy.yml logs --no-color
