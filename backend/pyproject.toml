[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "B008",  # FastAPI declares dependencies with Depends() in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"app/models/*" = ["F821"]  # SQLAlchemy relationships reference other models by name

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.black]
target-version = ["py312"]
line-length = 120
